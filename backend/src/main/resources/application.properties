spring.application.name=kiron-api

# Conexão com o MySQL e criação automática do banco se não existir
spring.datasource.url=jdbc:mysql://localhost:3306/kiron_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=

# Driver do MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Dialeto do Hibernate para MySQL
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# O JPA cria e atualiza as tabelas no MySQL automaticamente com base no código Java
spring.jpa.hibernate.ddl-auto=update

# Mostra no console os comandos SQL gerados pelo Hibernate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true